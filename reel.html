<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Reel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }
  .frame {
    width: 100%;
    max-width: 540px;
  }
  blockquote.instagram-media {
    margin: 0 auto !important;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <blockquote
        class="instagram-media"
        data-instgrm-captioned
        data-instgrm-permalink="https://www.instagram.com/reel/DfmBvgUNizn/?utm_source=ig_embed&amp;utm_campaign=loading"
        data-instgrm-version="14"
        style="background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin: 1px; max-width:540px; min-width:326px; padding:0; width:99.375%;">
        <a href="https://www.instagram.com/reel/DfmBvgUNizn/?utm_source=ig_embed&amp;utm_campaign=loading" target="_blank" rel="noopener">View this reel on Instagram</a>
      </blockquote>
    </div>
  </div>
  <script async src="//www.instagram.com/embed.js"></script>
</body>
</html>
