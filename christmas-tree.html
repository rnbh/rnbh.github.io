<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Christmas Tree</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000010;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at center top, #0a1026 0%, #000010 70%, #000 100%);
  }
  .hud {
    position: fixed;
    left: 12px;
    bottom: 12px;
    color: #9aa3b8;
    font-size: 11px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    pointer-events: none;
    letter-spacing: 0.5px;
    opacity: 0.85;
  }
  .hud .right {
    position: fixed;
    right: 12px;
    bottom: 12px;
    text-align: right;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div id="hudL">agac.py</div>
</div>
<div class="hud right">
  <div id="hudR">running · 30 fps</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hudL = document.getElementById('hudL');
const hudR = document.getElementById('hudR');

let W, H;
const CHAR_H = 12;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${CHAR_H}px "SF Mono", Menlo, Consolas, monospace`;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'center';
}
window.addEventListener('resize', resize);
resize();

// ---------- geometry ----------
const H_TREE = 3.2;
const R_BASE = 1.25;

const points = [];

// Foliage: dense cone, bottom-up reveal
const foliageChars = ['%', '#', '*', 'o', '.', '+', ':', 'x'];
const greens = ['#1a6b2e', '#217a36', '#2d8f3f', '#36a84a', '#124a20', '#165a28'];
for (let i = 0; i < 5500; i++) {
  const t = Math.pow(Math.random(), 0.6);
  const y = t * H_TREE;
  const taper = 1 - y / H_TREE;
  const r = R_BASE * taper * (0.75 + Math.random() * 0.3);
  const theta = Math.random() * Math.PI * 2;
  const bumpy = 1 + 0.06 * Math.sin(y * 10 + theta * 5);
  const x = r * bumpy * Math.cos(theta);
  const z = r * bumpy * Math.sin(theta);
  points.push({
    x, y, z,
    char: foliageChars[Math.floor(Math.random() * foliageChars.length)],
    color: greens[Math.floor(Math.random() * greens.length)],
    reveal: 0.1 + (1 - t) * 1.6,
    layer: 0
  });
}

// Trunk
for (let i = 0; i < 350; i++) {
  const y = -Math.random() * 0.35;
  const theta = Math.random() * Math.PI * 2;
  const r = 0.12 * (0.7 + Math.random() * 0.4);
  const x = r * Math.cos(theta);
  const z = r * Math.sin(theta);
  const barks = ['#5a3418', '#6b4423', '#7a4e26', '#4a2a13'];
  points.push({
    x, y, z,
    char: Math.random() < 0.5 ? '#' : '%',
    color: barks[Math.floor(Math.random() * barks.length)],
    reveal: 0.05,
    layer: 0
  });
}

// Garlands: golden spiral
for (let i = 0; i < 280; i++) {
  const t = i / 280;
  const y = 0.15 + t * (H_TREE - 0.3);
  const taper = 1 - y / H_TREE;
  const r = R_BASE * taper * 1.02;
  const theta = t * Math.PI * 9 + Math.sin(t * 20) * 0.2;
  const x = r * Math.cos(theta);
  const z = r * Math.sin(theta);
  points.push({
    x, y, z,
    char: Math.random() < 0.7 ? 'o' : '*',
    color: Math.random() < 0.6 ? '#ffd24a' : '#ffecb3',
    reveal: 2.0 + (1 - t) * 1.2,
    layer: 1,
    blink: Math.random() * Math.PI * 2
  });
}

// Ornaments (boules)
const ornColors = ['#ff2d2d', '#e11818', '#ffd700', '#ff8c42', '#d63384', '#3fa5ff', '#b24cff'];
for (let i = 0; i < 70; i++) {
  const t = Math.pow(Math.random(), 0.7);
  const y = 0.1 + t * (H_TREE - 0.4);
  const taper = 1 - y / H_TREE;
  const r = R_BASE * taper * (0.95 + Math.random() * 0.1);
  const theta = Math.random() * Math.PI * 2;
  const x = r * Math.cos(theta);
  const z = r * Math.sin(theta);
  points.push({
    x, y, z,
    char: 'O',
    color: ornColors[Math.floor(Math.random() * ornColors.length)],
    reveal: 3.8 + Math.random() * 1.0,
    layer: 2,
    blink: Math.random() * Math.PI * 2
  });
}

// Star cluster at the top
for (let i = 0; i < 35; i++) {
  const theta = Math.random() * Math.PI * 2;
  const rad = Math.random() * 0.18;
  const x = Math.cos(theta) * rad;
  const z = Math.sin(theta) * rad;
  const y = H_TREE + 0.05 + Math.random() * 0.25;
  points.push({
    x, y, z,
    char: Math.random() < 0.5 ? '@' : '*',
    color: '#ffff66',
    reveal: 5.2 + Math.random() * 0.3,
    layer: 3,
    glow: true
  });
}
// Star rays
for (let i = 0; i < 40; i++) {
  const theta = (i / 40) * Math.PI * 2;
  const rad = 0.2 + Math.random() * 0.25;
  points.push({
    x: Math.cos(theta) * rad * 0.3,
    y: H_TREE + 0.2 + Math.sin(theta) * rad * 0.3,
    z: Math.sin(theta) * rad * 0.3,
    char: '.',
    color: '#fff3a6',
    reveal: 5.4,
    layer: 3
  });
}

// Gifts under the tree
function gift(cx, cz, w, hGift, d, color, ribbon) {
  for (let i = 0; i < 400; i++) {
    const face = Math.random();
    let x, y, z;
    if (face < 0.33) {
      // top
      x = cx + (Math.random() - 0.5) * w;
      y = -0.35 - hGift;
      z = cz + (Math.random() - 0.5) * d;
    } else if (face < 0.66) {
      // front/back
      x = cx + (Math.random() - 0.5) * w;
      y = -0.35 - Math.random() * hGift;
      z = cz + (Math.random() < 0.5 ? -d / 2 : d / 2);
    } else {
      // sides
      x = cx + (Math.random() < 0.5 ? -w / 2 : w / 2);
      y = -0.35 - Math.random() * hGift;
      z = cz + (Math.random() - 0.5) * d;
    }
    points.push({
      x, y, z,
      char: Math.random() < 0.3 ? '#' : '%',
      color,
      reveal: 6.0 + Math.random() * 0.6,
      layer: 4
    });
  }
  // ribbon crosses
  for (let i = 0; i < 60; i++) {
    const t = i / 60;
    // ribbon on top horizontal
    points.push({
      x: cx + (t - 0.5) * w,
      y: -0.35 - hGift - 0.01,
      z: cz,
      char: '+',
      color: ribbon,
      reveal: 6.2,
      layer: 4
    });
    points.push({
      x: cx,
      y: -0.35 - hGift - 0.01,
      z: cz + (t - 0.5) * d,
      char: '+',
      color: ribbon,
      reveal: 6.2,
      layer: 4
    });
  }
}
gift(0.9, 0.1, 0.55, 0.4, 0.5, '#d61e1e', '#ffd24a');
gift(-0.85, -0.05, 0.6, 0.35, 0.55, '#f5c518', '#d61e1e');
gift(0.05, -0.9, 0.5, 0.3, 0.45, '#2a6fdb', '#ffffff');
gift(-0.1, 0.9, 0.45, 0.25, 0.4, '#9b1cae', '#ffd24a');

// Ground
for (let i = 0; i < 1200; i++) {
  const theta = Math.random() * Math.PI * 2;
  const r = 1.3 + Math.random() * 2.2;
  points.push({
    x: Math.cos(theta) * r,
    y: -0.35 - Math.random() * 0.02,
    z: Math.sin(theta) * r,
    char: Math.random() < 0.5 ? ':' : (Math.random() < 0.5 ? '.' : '+'),
    color: '#9aa3b8',
    reveal: 0,
    layer: -1,
    noRotate: false
  });
}

// Background stars
const bgStars = [];
for (let i = 0; i < 260; i++) {
  bgStars.push({
    x: Math.random(),
    y: Math.random() * 0.75,
    char: Math.random() < 0.5 ? '.' : ',',
    phase: Math.random() * Math.PI * 2,
    base: 0.3 + Math.random() * 0.6
  });
}

// Snow particles
const snow = [];
for (let i = 0; i < 280; i++) {
  snow.push({
    x: Math.random(),
    y: Math.random(),
    speed: 0.02 + Math.random() * 0.08,
    sway: 0.002 + Math.random() * 0.008,
    phase: Math.random() * Math.PI * 2,
    char: Math.random() < 0.3 ? '*' : (Math.random() < 0.6 ? '.' : '•'),
    size: Math.random() < 0.3 ? 14 : 11
  });
}

// ---------- render ----------
const start = performance.now();
let frameCount = 0;
let fpsTime = start;
let fps = 30;

function render(now) {
  const t = (now - start) / 1000;
  const angle = t * 0.45;
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);

  ctx.clearRect(0, 0, W, H);

  // Background stars
  ctx.font = `${CHAR_H}px "SF Mono", Menlo, Consolas, monospace`;
  for (const s of bgStars) {
    const alpha = s.base * (0.4 + 0.6 * Math.sin(t * 2 + s.phase));
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillText(s.char, s.x * W, s.y * H);
  }

  // Project tree points
  const scale = Math.min(W, H) * 0.19;
  const cx = W / 2;
  const cy = H * 0.65;

  const visible = [];
  for (const p of points) {
    if (t < p.reveal) continue;
    const rx = p.x * cosA - p.z * sinA;
    const rz = p.x * sinA + p.z * cosA;
    const sx = cx + rx * scale;
    const sy = cy - p.y * scale;
    visible.push({ sx, sy, z: rz, p });
  }
  visible.sort((a, b) => a.z - b.z);

  for (const v of visible) {
    let color = v.p.color;
    if (v.p.blink !== undefined) {
      const b = 0.6 + 0.4 * Math.sin(t * 3 + v.p.blink);
      // darken/brighten
      ctx.globalAlpha = b;
    } else if (v.p.glow) {
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 4);
    } else {
      ctx.globalAlpha = 1;
    }
    // depth fade (back = darker)
    const depth = (v.z + R_BASE) / (R_BASE * 2);
    const fade = 0.55 + 0.45 * depth;
    ctx.globalAlpha *= fade;
    ctx.fillStyle = color;
    ctx.fillText(v.p.char, v.sx, v.sy);
  }
  ctx.globalAlpha = 1;

  // Snow (overlay)
  for (const f of snow) {
    f.y += f.speed * 0.01;
    if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
    const sway = Math.sin(t * 1.2 + f.phase) * 0.015;
    const px = (f.x + sway) * W;
    const py = f.y * H;
    ctx.font = `${f.size}px "SF Mono", Menlo, Consolas, monospace`;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(f.char, px, py);
  }

  // HUD counters
  frameCount++;
  if (now - fpsTime > 500) {
    fps = Math.round((frameCount * 1000) / (now - fpsTime));
    frameCount = 0;
    fpsTime = now;
    const lights = Math.min(170, Math.floor(t * 40));
    hudL.textContent = `agac.py   rotation ${(angle * 57.3 % 360).toFixed(2)}°   lights ${lights}`;
    hudR.textContent = `running · ${fps} fps   emitters 8,486`;
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
